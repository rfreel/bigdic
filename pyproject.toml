[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigdic-operator-compiler"
version = "0.1.0"
description = "State-conditioned compiler and runtime controller for the bigdic operator dictionary"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
