name: external-local-model

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [operator-compiler-v1]
    paths:
      - '.github/workflows/external-local.yml'
      - 'scripts/run_local_model_smoke.py'
      - 'src/operator_compiler/experiments.py'

permissions:
  contents: read

jobs:
  qwen-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference stack
        run: python -m pip install -e . 'transformers>=4.46,<5' 'torch>=2.4' accelerate
      - name: Run isolated four-condition smoke
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/run_local_model_smoke.py --model Qwen/Qwen2.5-0.5B-Instruct --output results/local_model_smoke.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: local-model-smoke
          path: results/local_model_smoke.jsonl
